[package]
name = "taskloop"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A small, durable, skill-first execution runtime for Rust applications"
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
futures-util = "0.3"
jsonschema = { version = "0.60", default-features = false }
libc = "0.2"
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rusqlite = { version = "0.41", features = ["hooks"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
